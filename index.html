<!DOCTYPE html>
<html>
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'>
    <meta charset='utf-8'>
    <title>IRVE Roadbook Live</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
      :root { 
        --bg: #f8fafc; --text: #0f172a; --border: #cbd5e1; --card-bg: #ffffff; --input-bg: #ffffff; --input-border: #94a3b8; --pdc-bg: #f1f5f9; --btn-bg: #e2e8f0; --btn-text: #0f172a; 
        --op-color: #0284c7; --dispo-ok: #16a34a; --dispo-warn: #d97706; --dispo-alert: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212; --text: #e0e0e0; --border: #333333; --card-bg: #18181b; --input-bg: #18181b; --input-border: #3f3f46; --pdc-bg: #09090b; --btn-bg: #1e293b; --btn-text: #ffffff; 
          --op-color: #38bdf8; --dispo-ok: #4ade80; --dispo-warn: #fbbf24; --dispo-alert: #f87171;
        }
      }
      body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
      
      #map, #terminal-logs { 
          position: relative; 
          height: 45vh; 
          height: 45dvh; 
          width: 100%; 
          border-bottom: 2px solid #cbd5e1; 
          flex-shrink: 0; 
          box-sizing: border-box;
      }

      #terminal-logs { 
          display: none; 
          background: rgba(15,23,42,0.98); 
          color: #4ade80; 
          font-family: monospace; 
          font-size: 11px; 
          overflow-y: auto; 
          -webkit-overflow-scrolling: touch; 
          padding: 10px; 
          padding-bottom: 40px; 
          z-index: 10; 
          user-select: text;
          -webkit-user-select: text;
      }

      .map-custom-ctrl { background: #ffffff !important; width: 34px; height: 34px; line-height: 34px; text-align: center; font-weight: bold; font-size: 18px; color: #0f172a !important; cursor: pointer; border-radius: 6px; border: 1px solid #cbd5e1 !important; box-shadow: 0 2px 6px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
      .map-custom-ctrl.active-track { background: #16a34a !important; color: #ffffff !important; }
      
      #main-content { height: 55vh; height: 55dvh; flex: 1; overflow-y: auto; padding: 10px; box-sizing: border-box; }
      .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
      .refresh-btn { background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--border); padding: 5px 9px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
      
      /* 4 - Champ km réduit pour 4 digits max (environ 50px) */
      .input-field { background: var(--input-bg); color: var(--text); border: 1px solid var(--input-border); padding: 6px; width: 50px; border-radius: 6px; font-weight: bold; text-align: center; }
      
      /* 3 - Sélecteur opérateur */
      .select-field { background: var(--input-bg); color: var(--text); border: 1px solid var(--input-border); padding: 6px; border-radius: 6px; font-size: 13px; max-width: 130px; }

      .station-card { display: flex; flex-direction: column; border-bottom: 1px solid var(--border); padding: 12px 6px; cursor: pointer; background: var(--card-bg); border-radius: 6px; margin-bottom: 4px;}
      .station-main { display: flex; align-items: center; width: 100%; }
      .nav-block { width: 75px; min-width: 75px; border-right: 1px solid var(--border); margin-right: 12px; }
      .borne-container { display: flex; flex-direction: column; width: 14px; height: 18px; flex-shrink: 0; }
      .chapeau-rouge { height: 6px; background-color: #ef4444; border-top-left-radius: 6px; border-top-right-radius: 6px; }
      .base-blanche { flex: 1; background-color: #ffffff; border: 1px solid #9ca3af; border-top: none; display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 900; color: #1f2937; }
      .pk-line { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
      .detour-line { font-size: 11px; opacity: 0.7; margin-left: 18px; margin-top: 2px; }
      .info-block { flex: 1; min-width: 0; }
      .op-title { font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--op-color); }
      .st-name { font-size: 13px; opacity: 0.9; margin-top: 2px; }
      
      .tech-block { width: auto; min-width: 55px; text-align: right; border-left: 1px solid var(--border); padding-left: 8px; flex-shrink: 0; }
      
      .dispo-ok { color: var(--dispo-ok); } .dispo-warn { color: var(--dispo-warn); } .dispo-alert { color: var(--dispo-alert); }
      .pdc-panel { display: none; margin-top: 10px; font-size: 12px; background: var(--pdc-bg); padding: 10px; border-radius: 6px; }
      .pdc-panel.show { display: block; }
      .pdc-table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
      .pdc-table td, .pdc-table th { padding: 4px; border-bottom: 1px solid var(--border); font-family: monospace; font-size: 11px; }
      
      .pdc-table th:nth-child(1), .pdc-table td:nth-child(1) { width: 28%; word-break: break-all; overflow-wrap: break-word; }
      .pdc-table th:nth-child(2), .pdc-table td:nth-child(2) { width: 28%; }
      .pdc-table th:nth-child(3), .pdc-table td:nth-child(3) { width: 22%; }
      .pdc-table th:nth-child(4), .pdc-table td:nth-child(4) { width: 22%; }
      
      .log-err { color: #f87171; }
      .close-log-btn { position: sticky; top: 0; float: right; background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; z-index: 20; }
      
      /* 1 - Suppression du fond blanc autour de l'icône de position (divIcon transparent) */
      .user-loc-icon { background: transparent !important; border: none !important; }
      .user-loc-arrow { width: 28px; height: 28px; transition: transform 0.6s ease-out; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4)); }
    </style>
</head>
<body>
  <div id="terminal-logs">
      <button class="close-log-btn" onclick="toggleLogs()">✕ Fermer</button>
      <div id="log-content"></div>
  </div>

  <div id="map"></div>
  
  <div id="main-content">
    <div class="header-controls">
      <b>km :</b> <input type='number' id='kmInput' class='input-field' value="0" oninput='renderList()' max="9999">
      <!-- 3 - Filtre opérateurs -->
      <select id="opFilter" class="select-field" onchange="renderList()">
          <option value="ALL">Tous opérateurs</option>
      </select>
      
      <input type="file" id="gpxInput" accept=".gpx" style="display:none;" onchange="handleGPXUpload(event)">
      <!-- 2 - Boutons avec uniquement les icônes -->
      <button class="refresh-btn" onclick="document.getElementById('gpxInput').click()" title="Charger GPX">📁</button>
      <button class="refresh-btn" onclick="toggleLogs()" title="Logs">📝</button>
      <button class='refresh-btn' onclick="fetchLiveQualicharge()" title="Rafraîchir Live">🔄</button>
    </div>
    <div id="stationsContainer">
        <div style="text-align:center; opacity:0.6; padding: 20px;">Veuillez charger un fichier GPX pour commencer.<br><br>💡 (Bouton 📁)</div>
    </div>
  </div>

<script>
let map, gpxLine, userMarker, watchId = null, isAutoTrack = false, isSimulating = false, simInterval = null;
let gpxPoints = [], globalData = [], markers = {};
let lastValidLat = null, lastValidLng = null;
const RAYON_RECHERCHE_KM = 3.0, PUISSANCE_MIN_KW = 100.0, KM_MIN_DEPART = 5.0;

function log(tag, message, isError=false) {
    const ts = new Date().toLocaleTimeString('fr-FR');
    const pref = isError ? "❌ [ERREUR]" : "ℹ️ [INFO]";
    const line = `[${ts}] ${pref} [${tag}] ${message}`;
    if (isError) console.error(line); else console.log(line);
    
    const term = document.getElementById('terminal-logs');
    const content = document.getElementById('log-content');
    if (content) {
        const div = document.createElement('div');
        if(isError) div.className = 'log-err';
        div.innerText = line;
        content.appendChild(div);
        term.scrollTop = term.scrollHeight;
    }
}

function toggleLogs() {
    const t = document.getElementById('terminal-logs');
    const mapDiv = document.getElementById('map');
    const isOpen = t.style.display === 'block';
    
    if (isOpen) {
        t.style.display = 'none';
        mapDiv.style.display = 'block';
        if(map) map.invalidateSize();
    } else {
        mapDiv.style.display = 'none';
        t.style.display = 'block';
        t.scrollTop = t.scrollHeight;
    }
}

function initMap() {
    map = L.map('map').setView([46.5, 2.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.de/tiles/osmde/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    // 5 - Ajout des contrôles cartographiques personnalisés
    const MapCustomControls = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function() {
            let container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
            
            // a - Ajustement zoom trace entière
            let btnTrace = L.DomUtil.create('div', 'map-custom-ctrl', container);
            btnTrace.innerHTML = '🗺️'; btnTrace.title = "Zoomer sur toute la trace";
            btnTrace.onclick = (e) => { e.stopPropagation(); fitTraceBounds(); };

            // b - Acquisition ponctuelle GPS
            let btnGpsOnce = L.DomUtil.create('div', 'map-custom-ctrl', container);
            btnGpsOnce.innerHTML = '📍'; btnGpsOnce.title = "Acquisition GPS ponctuelle";
            btnGpsOnce.onclick = (e) => { e.stopPropagation(); getSinglePosition(); };

            // c - Suivi live navigation (Auto-track)
            let btnTrack = L.DomUtil.create('div', 'map-custom-ctrl', container);
            btnTrack.id = 'autoTrackBtn'; btnTrack.innerHTML = '🚗'; btnTrack.title = "Activer/Désactiver suivi live";
            btnTrack.onclick = (e) => { e.stopPropagation(); toggleAutoTrack(); };

            // d - Simulation de suivi navigation
            let btnSim = L.DomUtil.create('div', 'map-custom-ctrl', container);
            btnSim.id = 'simTrackBtn'; btnSim.innerHTML = '⏩'; btnSim.title = "Simuler le trajet sur la trace";
            btnSim.onclick = (e) => { e.stopPropagation(); toggleSimulation(); };

            // e - Zoom entre position actuelle et arrivée
            let btnZoomDest = L.DomUtil.create('div', 'map-custom-ctrl', container);
            btnZoomDest.innerHTML = '🎯'; btnZoomDest.title = "Zoom position actuelle -> Arrivée";
            btnZoomDest.onclick = (e) => { e.stopPropagation(); zoomCurrentToDestination(); };

            return container;
        }
    });
    map.addControl(new MapCustomControls());
    log("INIT", "Carte Leaflet initialisée avec contrôles.");
}

// 5a - Ajustement zoom à l'ensemble de la trace
function fitTraceBounds() {
    if(gpxLine) {
        map.fitBounds(gpxLine.getBounds());
        log("MAP", "Zoom ajusté à la trace GPX.");
    } else {
        log("MAP", "Aucune trace GPX chargée.", true);
    }
}

// 5b - Acquisition ponctuelle GPS sans suivi live
function getSinglePosition() {
    if(!navigator.geolocation) {
        log("GPS", "Géolocalisation non supportée.", true);
        return;
    }
    log("GPS", "Acquisition d'une position GPS ponctuelle...");
    navigator.geolocation.getCurrentPosition(
        pos => {
            updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.heading);
            log("GPS", "Position ponctuelle acquise avec succès.");
        },
        err => log("GPS", "Erreur acquisition : " + err.message, true),
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function toggleAutoTrack() {
    if(isSimulating) toggleSimulation(); // Stoppe la sim si active
    isAutoTrack = !isAutoTrack;
    const btn = document.getElementById('autoTrackBtn');
    if (isAutoTrack) {
        btn.classList.add('active-track');
        if(navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition(
                pos => updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.heading),
                err => log("GPS", "Erreur : " + err.message, true),
                { enableHighAccuracy: true, maximumAge: 3000 }
            );
            log("GPS", "Suivi live activé.");
        }
    } else {
        btn.classList.remove('active-track');
        if(watchId) navigator.geolocation.clearWatch(watchId);
        lastValidLat = null; lastValidLng = null;
        log("GPS", "Suivi live désactivé.");
    }
}

// 5c - Mode simulation du suivi navigation sur la trace
function toggleSimulation() {
    if(isAutoTrack) toggleAutoTrack(); // Stoppe le suivi live si actif
    isSimulating = !isSimulating;
    const btn = document.getElementById('simTrackBtn');
    
    if(isSimulating) {
        if(gpxPoints.length === 0) {
            log("SIM", "Impossible de simuler : aucun fichier GPX chargé.", true);
            isSimulating = false;
            return;
        }
        btn.classList.add('active-track');
        log("SIM", "Démarrage de la simulation de trajet...");
        let index = 0;
        simInterval = setInterval(() => {
            if(index >= gpxPoints.length) {
                toggleSimulation();
                log("SIM", "Simulation terminée (fin du tracé).");
                return;
            }
            let pt = gpxPoints[index];
            let nextPt = gpxPoints[index + 1] || pt;
            // Calcul cap grossier
            let heading = Math.atan2(nextPt.lon - pt.lon, nextPt.lat - pt.lat) * (180 / Math.PI);
            updatePosition(pt.lat, pt.lon, heading);
            index += Math.max(1, Math.floor(gpxPoints.length / 200)); // Avance par pas
        }, 1000);
    } else {
        btn.classList.remove('active-track');
        if(simInterval) clearInterval(simInterval);
        log("SIM", "Simulation arrêtée.");
    }
}

// 5d - Zoom ajustement pour voir la position actuelle et le point d'arrivée
function zoomCurrentToDestination() {
    if(gpxPoints.length === 0) {
        log("MAP", "Tracé GPX manquant pour cibler la destination.", true);
        return;
    }
    let lastPt = gpxPoints[gpxPoints.length - 1];
    let bounds = L.latLngBounds([[lastPt.lat, lastPt.lon]]);
    
    if(userMarker) {
        bounds.extend(userMarker.getLatLng());
        map.fitBounds(bounds, {padding: [50, 50]});
        log("MAP", "Zoom ajusté entre position actuelle et arrivée.");
    } else if(lastValidLat !== null) {
        bounds.extend([lastValidLat, lastValidLng]);
        map.fitBounds(bounds, {padding: [50, 50]});
        log("MAP", "Zoom ajusté entre position actuelle et arrivée.");
    } else {
        log("MAP", "Position actuelle inconnue (activez le GPS ou la simulation).", true);
    }
}

function updatePosition(lat, lng, heading) {
    if (!isSimulating && lastValidLat !== null && lastValidLng !== null) {
        let distanceMetres = distanceHaversine(lastValidLat, lastValidLng, lat, lng) * 1000;
        if (distanceMetres < 15) return;
    }
    
    lastValidLat = lat;
    lastValidLng = lng;

    map.panTo([lat, lng]);
    let h = heading || 0;
    let svg = `<div style="width:32px;height:32px;"><svg class="user-loc-arrow" style="transform: rotate(${h}deg);" viewBox="0 0 24 24"><path fill="#0284c7" stroke="#ffffff" stroke-width="2" d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg></div>`;
    
    if(userMarker) {
        userMarker.setLatLng([lat, lng]);
        let arrow = userMarker.getElement().querySelector('.user-loc-arrow');
        if(arrow) arrow.style.transform = `rotate(${h}deg)`;
    } else {
        // 1 - Utilisation de 'user-loc-icon' sans fond blanc parasite
        userMarker = L.marker([lat, lng], {icon: L.divIcon({html: svg, iconSize:[32,32], iconAnchor:[16,16], className: 'user-loc-icon'})}).addTo(map);
    }

    if(gpxPoints.length > 0) {
        let minDist = Infinity, bestKm = 0;
        for(let pt of gpxPoints) {
            let d = distanceHaversine(lat, lng, pt.lat, pt.lon);
            if(d < minDist) { minDist = d; bestKm = pt.km; }
        }
        document.getElementById('kmInput').value = Math.round(bestKm);
        renderList();
    }
}

function distanceHaversine(lat1, lon1, lat2, lon2) {
    const R = 6371.0, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function handleGPXUpload(event) {
    const file = event.target.files[0];
    if(!file) return;
    log("GPX", `Fichier '${file.name}' sélectionné. Lecture en cours...`);
    const reader = new FileReader();
    reader.onload = (e) => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(e.target.result, "text/xml");
        const trkpts = xml.getElementsByTagName("trkpt");
        gpxPoints = [];
        let km = 0, prev = null;
        for(let i=0; i<trkpts.length; i++) {
            let lat = parseFloat(trkpts[i].getAttribute("lat"));
            let lon = parseFloat(trkpts[i].getAttribute("lon"));
            if(prev) km += distanceHaversine(prev.lat, prev.lon, lat, lon);
            gpxPoints.push({lat, lon, km});
            prev = {lat, lon};
        }
        log("GPX", `${gpxPoints.length} points extraits. Distance totale : ${km.toFixed(1)} km.`);
        
        if(gpxLine) map.removeLayer(gpxLine);
        gpxLine = L.polyline(gpxPoints.map(p => [p.lat, p.lon]), {color: '#0284c7', weight: 4}).addTo(map);
        map.fitBounds(gpxLine.getBounds());
        
        toggleLogs(); 
        fetchAndFilterStations();
    };
    reader.readAsText(file);
}

function fetchAndFilterStations() {
    log("ÉTAPE 1", "Recherche du fichier IRVE statique sur data.gouv.fr...");
    fetch("https://www.data.gouv.fr/api/1/datasets/infrastructures-de-recharge-pour-vehicules-electriques-donnees-ouvertes/")
    .then(res => res.json())
    .then(data => {
        const url = data.resources.find(r => r.title.toLowerCase().includes('statique')).latest;
        log("STATIQUE", `Fichier trouvé. Téléchargement et analyse CSV en cours...`);
        
        Papa.parse(url, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                log("STATIQUE", `${results.data.length} bornes brutes téléchargées. Filtrage...`);
                processStaticData(results.data);
            }
        });
    }).catch(e => log("ÉTAPE 1", "Erreur réseau: " + e.message, true));
}

function processStaticData(rawData) {
    let stationsMap = new Map();
    let operatorsSet = new Set(); // 3 - Pour alimenter le select opérateur

    rawData.forEach(row => {
        let pwr = parseFloat(row.puissance_nominale || row.puissance_max_kw || 0);
        if (pwr < PUISSANCE_MIN_KW) return;
        
        let coordsStr = row.coordonneesXY || row.xy_coords || row.coordonnees;
        if(!coordsStr) return;
        let c = coordsStr.replace('[','').replace(']','').split(',');
        let lon = parseFloat(c[0]), lat = parseFloat(c[1]);
        if(isNaN(lat) || isNaN(lon)) return;
        
        let opName = row.nom_amenageur || "IRVE";
        operatorsSet.add(opName);

        let stId = row.id_station_itinerance || row.nom_station;
        if(!stationsMap.has(stId)) {
            stationsMap.set(stId, {
                id: stId, nom: row.nom_station, op: opName,
                lat: lat, lng: lon, pwr: pwr, pdcs: []
            });
        }
        let st = stationsMap.get(stId);
        if(pwr > st.pwr) st.pwr = pwr;
        st.pdcs.push(row.id_pdc_itinerance);
    });

    // 3 - Remplissage du select des opérateurs
    let opSelect = document.getElementById('opFilter');
    let currentOp = opSelect.value;
    opSelect.innerHTML = '<option value="ALL">Tous opérateurs</option>';
    Array.from(operatorsSet).sort().forEach(op => {
        let opt = document.createElement('option');
        opt.value = op;
        opt.innerText = op;
        opSelect.appendChild(opt);
    });
    opSelect.value = currentOp;

    log("TRAITEMENT", `${stationsMap.size} stations rapides identifiées. Projection sur le GPX...`);
    
    let sampled = gpxPoints.filter((_, i) => i % 3 === 0);
    globalData = [];
    
    stationsMap.forEach(st => {
        let minDist = Infinity, bestKm = 0;
        for(let pt of sampled) {
            let d = distanceHaversine(st.lat, st.lng, pt.lat, pt.lon);
            if(d < minDist) { minDist = d; bestKm = pt.km; }
        }
        
        if (minDist <= RAYON_RECHERCHE_KM && bestKm >= KM_MIN_DEPART) {
            globalData.push({
                ...st, km: bestKm, detour: minDist,
                dispo: st.pdcs.length, total: st.pdcs.length, liveInfo: []
            });
        }
    });
    
    globalData.sort((a,b) => a.km - b.km);
    log("PROJECTION", `${globalData.length} stations retenues le long du tracé.`);
    renderList();
    fetchLiveQualicharge();
}

function fetchLiveQualicharge() {
    if(globalData.length === 0) {
        log("LIVE", "Aucune station en mémoire pour lancer le live.", true);
        return;
    }
    log("LIVE", "Recherche du fichier dynamique Qualicharge sur data.gouv.fr...");
    
    fetch("https://www.data.gouv.fr/api/1/datasets/infrastructures-de-recharge-pour-vehicules-electriques-donnees-ouvertes/")
    .then(res => res.json())
    .then(data => {
        const resource = data.resources.find(r => 
            r.title.toLowerCase().includes('dynamique') || 
            r.title.toLowerCase().includes('disponibilité') ||
            r.description?.toLowerCase().includes('dynamique')
        );
        
        const liveUrl = resource ? resource.latest : "https://www.data.gouv.fr/fr/datasets/r/411443b1-6667-473f-8217-1c57c167408f";
        log("LIVE", `URL dynamique trouvée. Téléchargement CSV en cours...`);
        
        Papa.parse(liveUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                log("LIVE", `Flux Qualicharge chargé (${res.data.length} lignes). Analyse...`);
                let dict = {};
                res.data.forEach(r => { if(r.id_pdc_itinerance) dict[r.id_pdc_itinerance] = r; });
                
                globalData.forEach(st => {
                    let countOk = 0;
                    st.liveInfo = [];
                    st.pdcs.forEach(pdcId => {
                        let info = dict[pdcId] || { etat_pdc: "INCONNU", occupation_pdc: "INCONNU", horodatage: "N/A" };
                        
                        let etatClean = (info.etat_pdc || "").trim().toLowerCase();
                        let occupClean = (info.occupation_pdc || "").trim().toLowerCase();
                        
                        let estEnService = ["en_service", "active", "available", "disponible"].includes(etatClean);
                        etatClean = estEnService ? "en_service" : info.etat_pdc;

                        let estLibre = ["libre", "free", "false", "0", "available"].includes(occupClean);
                        occupClean = estLibre ? "libre" : info.occupation_pdc;

                        if (estEnService && estLibre) {
                            countOk++;
                        }
                        st.liveInfo.push({id: pdcId, etat: etatClean, occup: occupClean, h: (info.horodatage || "").substring(0,16).replace('T',' ')});
                    });
                    st.dispo = countOk;
                });
                log("LIVE", "Disponibilités mises à jour avec succès !");
                renderList();
            },
            error: function(err) { log("LIVE", "Erreur chargement flux live: " + err.message, true); }
        });
    })
    .catch(e => log("LIVE", "Erreur réseau API live: " + e.message, true));
}

function renderList() {
    const kmFilter = parseFloat(document.getElementById('kmInput').value) || 0;
    const selectedOp = document.getElementById('opFilter').value; // 3 - Récupération filtre opérateur

    for(let k in markers) map.removeLayer(markers[k]);
    markers = {};
    
    let html = "";
    globalData.forEach((s, i) => {
        if (s.km < kmFilter) return;
        if (selectedOp !== "ALL" && s.op !== selectedOp) return; // 3 - Application filtre opérateur
        
        let status = s.dispo === 0 ? 'dispo-alert' : (s.dispo <= s.total/3 ? 'dispo-warn' : 'dispo-ok');
        let color = s.dispo === 0 ? '#dc2626' : (s.dispo <= s.total/3 ? '#d97706' : '#16a34a');
        
        let m = L.circleMarker([s.lat, s.lng], {radius:8, fillColor:color, color:'#fff', weight:1, fillOpacity:0.9}).addTo(map);
        m.bindPopup(`<b>${s.op}</b><br>${s.nom}`);
        markers[i] = m;
        
        let pdcsHtml = s.liveInfo.map(p => `<tr><td>${p.id}</td><td><b>${p.etat}</b></td><td>${p.occup}</td><td>${p.h}</td></tr>`).join('');
        if(!pdcsHtml) pdcsHtml = `<tr><td colspan="4">Aucun statut disponible</td></tr>`;
        
        html += `
        <div class='station-card' onclick="map.setView([${s.lat}, ${s.lng}], 14); markers[${i}].openPopup();">
          <div class='station-main'>
            <div class='nav-block'>
              <div class='pk-line'>
                <div class='borne-container'><div class='chapeau-rouge'></div><div class='base-blanche'>km</div></div>
                <span class='pk-val'>${(s.km - kmFilter).toFixed(1)}</span>
              </div>
              <div class='detour-line'>↳<i>${s.detour.toFixed(2)}</i></div>
            </div>
            <div class='info-block'>
              <div class='op-title'>${s.op}</div>
              <div class='st-name'>${s.nom}</div>
            </div>
            <div class='tech-block' onclick="event.stopPropagation(); document.getElementById('pdc_${i}').classList.toggle('show')">
              <div style='font-weight:bold; font-size:12px;'>${s.pwr}kW</div>
              <div class='${status}' style='font-size:11px; font-weight:bold;'>${s.dispo}/${s.total} PDC</div>
            </div>
          </div>
          <div id='pdc_${i}' class='pdc-panel'>
            <table class='pdc-table'>
              <thead><tr><th>PDC</th><th>Etat</th><th>Occupation</th><th>Heure</th></tr></thead>
              <tbody>${pdcsHtml}</tbody>
            </table>
          </div>
        </div>`;
    });
    
    document.getElementById('stationsContainer').innerHTML = html || "<div style='padding:20px; text-align:center;'>Aucune station trouvée avec ces critères.</div>";
}

initMap();
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(() => log("PWA", "Service Worker installé."));
  });
}
</script>

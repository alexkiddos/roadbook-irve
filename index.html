<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRVE Roadbook Live</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--card-bg);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    h1 {
      font-size: 1.1rem;
      margin: 0;
      color: var(--accent-color);
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="file"], select, button {
      background-color: #334155;
      color: var(--text-color);
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    button {
      cursor: pointer;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      border: none;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #main-container {
      display: flex;
      flex: 1;
      position: relative;
    }

    #map {
      flex: 1;
      height: 100%;
      width: 100%;
    }

    #sidebar {
      width: 320px;
      background-color: var(--card-bg);
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #logs {
      padding: 8px;
      background-color: #020617;
      font-family: monospace;
      font-size: 0.75rem;
      color: #94a3b8;
      height: 80px;
      overflow-y: auto;
      border-bottom: 1px solid #334155;
    }

    #station-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .station-card {
      background-color: #334155;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .station-card h3 {
      margin: 0 0 4px 0;
      font-size: 0.95rem;
      color: var(--accent-color);
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .badge-power { background-color: #0284c7; color: white; }
    .badge-free { background-color: #16a34a; color: white; }
    .badge-busy { background-color: #dc2626; color: white; }
    .badge-unknown { background-color: #64748b; color: white; }

    @media (max-width: 768px) {
      #main-container {
        flex-direction: column;
      }
      #sidebar {
        width: 100%;
        height: 40%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ IRVE Live</h1>
    <div class="controls">
      <input type="file" id="gpx-input" accept=".gpx">
      <select id="operator-filter">
        <option value="ALL">Tous les opérateurs</option>
      </select>
      <button id="refresh-qualicharge-btn" onclick="updateQualichargeLive()">🔄 Live</button>
    </div>
  </header>

  <div id="main-container">
    <div id="map"></div>
    <div id="sidebar">
      <div id="logs">Initialisation de l'application...</div>
      <div id="station-list">
        <p style="text-align: center; color: #64748b;">Chargez un fichier GPX pour afficher les bornes du trajet.</p>
      </div>
    </div>
  </div>

  <!-- Scripts externes -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // ============================================================================
    // 1. GESTION DE LA BASE LOCALE INDEXEDDB (MODE HORS-LIGNE)
    // ============================================================================
    const DB_NAME = 'IRVEDatabase';
    const DB_VERSION = 1;
    const STORE_NAME = 'stations';
    const MAX_AGE_DAYS = 7;

    function log(msg) {
      const logDiv = document.getElementById('logs');
      logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveStationsToDB(stations) {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(stations, 'cached_stations');
        store.put(Date.now(), 'last_update_timestamp');
        log("💾 Base IRVE locale sauvegardée (IndexedDB).");
      } catch (err) {
        log("⚠️ Erreur sauvegarde IndexedDB: " + err.message);
      }
    }

    async function getCachedStations() {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        
        const stations = await new Promise(r => {
          const req = store.get('cached_stations');
          req.onsuccess = () => r(req.result);
        });
        
        const timestamp = await new Promise(r => {
          const req = store.get('last_update_timestamp');
          req.onsuccess = () => r(req.result);
        });

        if (!stations || !timestamp) return null;

        const ageInDays = (Date.now() - timestamp) / (1000 * 60 * 60 * 24);
        return { stations, isOutdated: ageInDays > MAX_AGE_DAYS };
      } catch (err) {
        log("⚠️ Erreur lecture IndexedDB: " + err.message);
        return null;
      }
    }

    // ============================================================================
    // 2. INITIALISATION ET CARTE LEAFLET
    // ============================================================================
    let map = L.map('map').setView([46.603354, 1.888334], 6); // Centre France
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let currentGPXPoints = [];
    let displayedStations = [];
    let markersGroup = L.layerGroup().addTo(map);

    // Formule d'Haversine pour le calcul de distance
    function getHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Rayon de la Terre en km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => log("Service Worker actif."))
        .catch(err => log("SW erreur: " + err));
    }

    // ============================================================================
    // 3. CHARGEMENT HORS-LIGNE & RESEAU DES BORNES IRVE (9 CHAMPS CONSOLIDES)
    // ============================================================================
    async function loadIRVEStationsAndProcess(gpxData) {
      log("Recherche des bornes en local...");
      const cachedData = await getCachedStations();
      let stationsToUse = null;

      if (cachedData) {
        log("⚡ Base locale trouvée ! Utilisation immédiate.");
        stationsToUse = cachedData.stations;
        processStationsWithGPX(stationsToUse, gpxData);

        if (!cachedData.isOutdated || !navigator.onLine) {
          if (!navigator.onLine) log("🌐 Mode Hors-ligne actif.");
          return;
        }
        log("🔄 Base locale > 7 jours. Mise à jour en arrière-plan...");
      }

      // Téléchargement depuis le fichier consolidé data.gouv.fr si en ligne
      if (navigator.onLine) {
        try {
          log("📥 Téléchargement IRVE réseau...");
          const response = await fetch('https://www.data.gouv.fr/fr/datasets/r/eb9471a7-5b6d-4bc0-94e8-4b28b4468e42');
          const csvText = await response.text();

          Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
              // Extraction stricte des 9 champs officiels consolidés
              const cleanedStations = results.data.map(row => ({
                idStation: row.id_station,
                idPdc: row.id_pdc,
                name: row.nom_station,
                operator: row.nom_operateur,
                power: parseFloat(row.puissance_nominale) || 0,
                lat: parseFloat(row.consolidated_latitude),   // 1 seul 't' dans l'entête CSV
                lng: parseFloat(row.consolidated_longitude),
                zipCode: row.consolidated_code_postal,
                city: row.consolidated_commune
              })).filter(s => !isNaN(s.lat) && !isNaN(s.lng));

              await saveStationsToDB(cleanedStations);

              if (!stationsToUse) {
                processStationsWithGPX(cleanedStations, gpxData);
              }
            }
          });
        } catch (error) {
          log("⚠️ Échec de mise à jour réseau IRVE.");
        }
      } else if (!stationsToUse) {
        alert("Vous êtes hors-ligne et aucune base de bornes n'a encore été enregistrée localement.");
      }
    }

    // ============================================================================
    // 4. TRAITEMENT DU TRAJET GPX & FILTRAGE SPATIAL (< 3 KM)
    // ============================================================================
    document.getElementById('gpx-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(event.target.result, "text/xml");
        const trkpts = xmlDoc.querySelectorAll('trkpt');

        currentGPXPoints = [];
        const latLngs = [];

        trkpts.forEach(pt => {
          const lat = parseFloat(pt.getAttribute('lat'));
          const lng = parseFloat(pt.getAttribute('lon'));
          currentGPXPoints.push({ lat, lng });
          latLngs.push([lat, lng]);
        });

        // Afficher le tracé GPX sur la carte
        markersGroup.clearLayers();
        const polyline = L.polyline(latLngs, { color: '#38bdf8', weight: 4 }).addTo(markersGroup);
        map.fitBounds(polyline.getBounds());

        log(`GPX chargé: ${currentGPXPoints.length} points.`);
        loadIRVEStationsAndProcess(currentGPXPoints);
      };
      reader.readAsText(file);
    });

    function processStationsWithGPX(allStations, gpxPoints) {
      log("Calcul des bornes proches de l'itinéraire...");
      
      // Filtrer les bornes à moins de 3 km du tracé
      displayedStations = allStations.filter(station => {
        return gpxPoints.some(pt => getHaversineDistance(pt.lat, pt.lng, station.lat, station.lng) <= 3.0);
      });

      log(`${displayedStations.length} bornes identifiées sur le trajet.`);
      populateOperatorFilter(displayedStations);
      renderStationsAndMarkers(displayedStations);

      // Si du réseau est présent, tenter la mise à jour Qualicharge Live
      if (navigator.onLine) {
        updateQualichargeLive();
      }
    }

    // ============================================================================
    // 5. AFFICHAGE DES MARQUEURS ET DE LA LISTE
    // ============================================================================
    function populateOperatorFilter(stations) {
      const select = document.getElementById('operator-filter');
      select.innerHTML = '<option value="ALL">Tous les opérateurs</option>';
      
      const operators = [...new Set(stations.map(s => s.operator).filter(Boolean))].sort();
      operators.forEach(op => {
        const opt = document.createElement('option');
        opt.value = op;
        opt.textContent = op;
        select.appendChild(opt);
      });
    }

    document.getElementById('operator-filter').addEventListener('change', function() {
      const selected = this.value;
      const filtered = selected === 'ALL' 
        ? displayedStations 
        : displayedStations.filter(s => s.operator === selected);
      renderStationsAndMarkers(filtered);
    });

    function renderStationsAndMarkers(stations) {
      // Nettoyer les anciens marqueurs de bornes (garder la polyline GPX)
      markersGroup.eachLayer(layer => {
        if (layer instanceof L.Marker) markersGroup.removeLayer(layer);
      });

      const listContainer = document.getElementById('station-list');
      listContainer.innerHTML = '';

      stations.forEach(s => {
        // 1. Marqueur Carte
        const marker = L.marker([s.lat, s.lng]).addTo(markersGroup);
        const statusBadge = s.status ? `<span class="badge badge-${getStatusColor(s.status)}">${s.status}</span>` : '';

        marker.bindPopup(`
          <b>${s.name || 'Station IRVE'}</b><br>
          <i>${s.operator || 'Opérateur inconnu'}</i><br>
          Ville : ${s.city || ''} (${s.zipCode || ''})<br>
          Puissance : <b>${s.power} kW</b><br>
          ID PDC : <code>${s.idPdc || s.idStation}</code><br>
          ${statusBadge}
        `);

        // 2. Carte dans la Sidebar
        const card = document.createElement('div');
        card.className = 'station-card';
        card.innerHTML = `
          <h3>${s.name || 'Station IRVE'}</h3>
          <div>Opérateur : <b>${s.operator || 'N/C'}</b></div>
          <div>Ville : ${s.city || ''} (${s.zipCode || ''})</div>
          <span class="badge badge-power">${s.power} kW</span>
          ${statusBadge}
        `;
        card.addEventListener('click', () => {
          map.setView([s.lat, s.lng], 15);
          marker.openPopup();
        });
        listContainer.appendChild(card);
      });
    }

    function getStatusColor(status) {
      if (!status) return 'unknown';
      const st = status.toLowerCase();
      if (st.includes('available') || st.includes('libre')) return 'free';
      if (st.includes('occupied') || st.includes('occupé')) return 'busy';
      return 'unknown';
    }

    // ============================================================================
    // 6. DISPONIBILITE TEMPS REEL QUALICHARGE
    // ============================================================================
    async function updateQualichargeLive() {
      if (!navigator.onLine) {
        log("🌐 Hors-ligne : Qualicharge Live indisponible.");
        return;
      }

      log("🔄 Récupération des statuts Qualicharge...");
      try {
        const res = await fetch('https://www.data.gouv.fr/fr/datasets/r/77983610-867f-4cc5-9c5e-8566a0d4c987');
        const qualichargeText = await res.text();

        Papa.parse(qualichargeText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            let updatedCount = 0;
            results.data.forEach(q => {
              // Match par idPdc ou idStation avec nos stations
              const target = displayedStations.find(s => s.idPdc === q.id_pdc || s.idStation === q.id_station);
              if (target) {
                target.status = q.etat;
                updatedCount++;
              }
            });

            log(`✅ Live mis à jour (${updatedCount} PDC mis à jour).`);
            const selectedOp = document.getElementById('operator-filter').value;
            const filtered = selectedOp === 'ALL' 
              ? displayedStations 
              : displayedStations.filter(s => s.operator === selectedOp);
            renderStationsAndMarkers(filtered);
          }
        });
      } catch (err) {
        log("⚠️ Erreur maj Qualicharge: " + err.message);
      }
    }
  </script>
</body>
</html>
